[package]
name = "tgin"
version = "0.1.0"
edition = "2021"
description = "Universal traffic glue: a Rust construction kit for gateways — HTTP, Telegram bots, RabbitMQ, Kafka, WebSocket tunnels"
license = "MIT"
repository = "https://github.com/chesnokpeter/tgin"
readme = "README.md"
keywords = ["gateway", "proxy", "telegram", "kafka", "rabbitmq"]
categories = ["network-programming", "web-programming", "asynchronous"]
include = ["src/**/*.rs", "examples/*.rs", "/Cargo.toml", "/README.md", "/HISTORY.md", "/LICENSE"]

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
async-trait = "0.1"
lapin = "3.7.2"
rdkafka = { version = "0.36", features = ["tokio", "libz"] }
bytes = "1"
tokio-tungstenite = "0.24"
futures-lite = "2.6.1"
futures = "0.3.31"
dashmap = "6.1.0"
tokio-util = "0.7.18"
uuid = { version = "1.20.0", features = ["v4", "serde"] }

[dev-dependencies]
wiremock = "0.6.5"
tower = { version = "0.5.2", features = ["util"] }
http-body-util = "0.1.3"
