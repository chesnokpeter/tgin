services:
  tgin:
    build:
      context: ../..
      dockerfile: demos/Dockerfile
    command: /app/ingestion_pipeline
    environment:
      RABBIT_URL: amqp://guest:guest@rabbitmq:5672
      PROCESSOR_URL: http://processor:8000
    ports:
      - "8080:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      processor:
        condition: service_started

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  processor:
    image: python:3.12-slim
    command: python /processor.py
    environment:
      NAME: processor
    volumes:
      - ./processor.py:/processor.py:ro
